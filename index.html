<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Basics — Fill in the Blanks Test</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --warn: #f78166;
    --yellow: #e3b341;
    --purple: #bc8cff;
    --text: #c9d1d9;
    --muted: #8b949e;
    --code-bg: #0d1117;
    --correct: #1a4a1a;
    --correct-border: #3fb950;
    --wrong: #4a1a1a;
    --wrong-border: #f78166;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NOISE TEXTURE */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.4;
  }

  .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem 6rem; position: relative; z-index: 1; }

  /* HEADER */
  header {
    text-align: center;
    padding: 3.5rem 0 3rem;
    position: relative;
  }
  header::after {
    content: '';
    display: block;
    width: 100px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 2rem auto 0;
  }
  .tag {
    display: inline-block;
    font-family: 'Fira Code', monospace;
    font-size: 0.72rem;
    color: var(--accent);
    background: rgba(88,166,255,0.1);
    border: 1px solid rgba(88,166,255,0.25);
    padding: 0.3rem 0.85rem;
    border-radius: 20px;
    letter-spacing: 0.08em;
    margin-bottom: 1.2rem;
  }
  h1 {
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
    letter-spacing: -0.02em;
  }
  h1 span { color: var(--accent); }
  .subtitle {
    margin-top: 0.9rem;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 400;
  }

  /* PROGRESS BAR */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.4rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .progress-label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; font-family: 'Fira Code', monospace; }
  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    border-radius: 99px;
    width: 0%;
    transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .progress-count { font-size: 0.82rem; color: var(--accent); font-family: 'Fira Code', monospace; white-space: nowrap; }

  /* QUESTION CARD */
  .question {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 1.5rem;
    overflow: hidden;
    transition: border-color 0.3s, transform 0.2s;
    animation: fadeUp 0.4s ease backwards;
  }
  .question:hover { border-color: #444c56; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .question:nth-child(1)  { animation-delay: 0.05s; }
  .question:nth-child(2)  { animation-delay: 0.10s; }
  .question:nth-child(3)  { animation-delay: 0.15s; }
  .question:nth-child(4)  { animation-delay: 0.20s; }
  .question:nth-child(5)  { animation-delay: 0.25s; }
  .question:nth-child(6)  { animation-delay: 0.30s; }
  .question:nth-child(7)  { animation-delay: 0.35s; }
  .question:nth-child(8)  { animation-delay: 0.40s; }
  .question:nth-child(9)  { animation-delay: 0.45s; }
  .question:nth-child(10) { animation-delay: 0.50s; }

  .q-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1.2rem;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  .q-num {
    font-family: 'Fira Code', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.2rem 0.55rem;
    border-radius: 6px;
    min-width: 42px;
    text-align: center;
  }
  .q-topic {
    font-size: 0.75rem;
    color: var(--yellow);
    background: rgba(227,179,65,0.08);
    border: 1px solid rgba(227,179,65,0.2);
    padding: 0.2rem 0.6rem;
    border-radius: 20px;
    font-weight: 500;
    letter-spacing: 0.04em;
  }
  .q-status {
    margin-left: auto;
    font-size: 0.75rem;
    color: var(--muted);
    font-family: 'Fira Code', monospace;
  }

  .q-body { padding: 1.2rem 1.4rem 1.4rem; }
  .q-instruction {
    font-size: 0.88rem;
    color: var(--muted);
    margin-bottom: 1rem;
    line-height: 1.6;
  }
  .q-instruction strong { color: var(--text); }

  /* CODE BLOCK */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
    font-family: 'Fira Code', monospace;
    font-size: 0.88rem;
    line-height: 2;
    color: var(--text);
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .code-block .kw   { color: #ff7b72; }   /* keyword */
  .code-block .fn   { color: #d2a8ff; }   /* function */
  .code-block .str  { color: #a5d6ff; }   /* string */
  .code-block .num  { color: #79c0ff; }   /* number */
  .code-block .var  { color: #ffa657; }   /* variable */
  .code-block .cm   { color: #8b949e; font-style: italic; } /* comment */
  .code-block .op   { color: #ff7b72; }   /* operator */

  /* BLANK INPUT */
  .blank {
    display: inline-block;
    font-family: 'Fira Code', monospace;
    font-size: 0.88rem;
    background: rgba(88,166,255,0.08);
    border: 1.5px dashed rgba(88,166,255,0.45);
    border-radius: 5px;
    padding: 0 0.4rem;
    color: var(--accent);
    min-width: 80px;
    height: 26px;
    vertical-align: middle;
    outline: none;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    caret-color: var(--accent);
  }
  .blank:focus {
    background: rgba(88,166,255,0.12);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
  }
  .blank.correct {
    background: rgba(63,185,80,0.12);
    border-color: var(--accent2);
    color: var(--accent2);
    border-style: solid;
  }
  .blank.wrong {
    background: rgba(247,129,102,0.12);
    border-color: var(--warn);
    color: var(--warn);
    border-style: solid;
  }

  /* RESULT BADGE on card */
  .q-result-badge {
    display: none;
    font-size: 0.78rem;
    padding: 0.25rem 0.7rem;
    border-radius: 20px;
    font-weight: 600;
  }
  .q-result-badge.correct { display: inline-block; background: rgba(63,185,80,0.15); color: var(--accent2); border: 1px solid rgba(63,185,80,0.3); }
  .q-result-badge.wrong   { display: inline-block; background: rgba(247,129,102,0.15); color: var(--warn); border: 1px solid rgba(247,129,102,0.3); }

  .answer-reveal {
    display: none;
    margin-top: 0.9rem;
    font-family: 'Fira Code', monospace;
    font-size: 0.8rem;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
  }
  .answer-reveal .ans-label { color: var(--accent2); margin-right: 0.4rem; }

  /* SUBMIT SECTION */
  .submit-section {
    text-align: center;
    padding: 2.5rem 0 1rem;
  }
  .btn-submit {
    background: linear-gradient(135deg, #1f6feb, #388bfd);
    color: #fff;
    border: none;
    padding: 0.95rem 3rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    border-radius: 10px;
    cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 24px rgba(56,139,253,0.35);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    position: relative;
    overflow: hidden;
  }
  .btn-submit::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
    border-radius: inherit;
  }
  .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(56,139,253,0.5); filter: brightness(1.08); }
  .btn-submit:active { transform: translateY(0); }

  /* RESULTS PANEL */
  #results-panel {
    display: none;
    margin-top: 2.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.5s ease;
  }
  .results-header {
    background: linear-gradient(135deg, #161b22, #1c2128);
    border-bottom: 1px solid var(--border);
    padding: 2rem;
    text-align: center;
  }
  .score-ring {
    width: 110px; height: 110px;
    border-radius: 50%;
    margin: 0 auto 1.2rem;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    font-family: 'Fira Code', monospace;
    position: relative;
  }
  .score-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .score-ring .score-num { font-size: 1.9rem; font-weight: 700; color: #fff; line-height: 1; position: relative; z-index: 1; }
  .score-ring .score-total { font-size: 0.72rem; color: var(--muted); position: relative; z-index: 1; }
  .grade-badge {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 0.4rem;
  }
  .grade-msg { color: var(--muted); font-size: 0.9rem; }

  .results-breakdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--border);
  }
  .stat-box {
    padding: 1.2rem;
    text-align: center;
    border-right: 1px solid var(--border);
  }
  .stat-box:last-child { border-right: none; }
  .stat-num { font-size: 1.6rem; font-weight: 700; font-family: 'Fira Code', monospace; }
  .stat-label { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }

  .btn-retry {
    display: inline-block;
    margin-top: 1.5rem;
    background: transparent;
    color: var(--accent);
    border: 1px solid rgba(88,166,255,0.4);
    padding: 0.7rem 2rem;
    font-size: 0.9rem;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .btn-retry:hover { background: rgba(88,166,255,0.08); border-color: var(--accent); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  @media (max-width: 600px) {
    .results-breakdown { grid-template-columns: 1fr; }
    .stat-box { border-right: none; border-bottom: 1px solid var(--border); }
    .stat-box:last-child { border-bottom: none; }
    .code-block { font-size: 0.78rem; }
    .blank { min-width: 60px; font-size: 0.78rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="tag"># python_basics_test.py</div>
    <h1>Python Basics<br><span>Fill in the Blanks</span></h1>
    <p class="subtitle">Variables · Operators · F-Strings · Input Function &nbsp;|&nbsp; 20 Questions</p>
  </header>

  <div class="progress-wrap">
    <span class="progress-label">progress</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-count" id="progressCount">0 / 20 filled</span>
  </div>

  <div id="quiz-form">
    <!-- Questions injected by JS -->
  </div>

  <div class="submit-section">
    <button class="btn-submit" onclick="submitTest()">Submit Test &nbsp;→</button>
  </div>

  <div id="results-panel">
    <div class="results-header">
      <div class="score-ring">
        <svg viewBox="0 0 110 110">
          <circle cx="55" cy="55" r="48" fill="none" stroke="#30363d" stroke-width="8"/>
          <circle id="scoreCircle" cx="55" cy="55" r="48" fill="none" stroke="#58a6ff" stroke-width="8"
            stroke-dasharray="301.59" stroke-dashoffset="301.59" stroke-linecap="round"
            style="transition: stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1), stroke 0.5s"/>
        </svg>
        <span class="score-num" id="scoreNum">0</span>
        <span class="score-total">/ 20</span>
      </div>
      <div class="grade-badge" id="gradeBadge"></div>
      <div class="grade-msg" id="gradeMsg"></div>
      <div><button class="btn-retry" onclick="retryTest()">↺ &nbsp;Try Again</button></div>
    </div>
    <div class="results-breakdown">
      <div class="stat-box">
        <div class="stat-num" id="statCorrect" style="color:var(--accent2)">0</div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statWrong" style="color:var(--warn)">0</div>
        <div class="stat-label">Wrong</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statPercent" style="color:var(--accent)">0%</div>
        <div class="stat-label">Score</div>
      </div>
    </div>
  </div>

</div>

<script>
// ─────────────────────────────────────────────
// QUESTION BANK
// Each blank: { id, answer (array of accepted answers) }
// ─────────────────────────────────────────────
const questions = [
  {
    num: 1,
    topic: "Variables",
    instruction: "Store the text <strong>\"Python\"</strong> in a variable called <strong>language</strong>.",
    code: `<span class="var">language</span> <span class="op">=</span> <input class="blank" data-q="1" data-b="0" placeholder="___">`,
    blanks: [{ accepted: ['"Python"', "'Python'"] }]
  },
  {
    num: 2,
    topic: "Variables",
    instruction: "Store the number <strong>25</strong> in a variable called <strong>age</strong>.",
    code: `<input class="blank" data-q="2" data-b="0" placeholder="___"> <span class="op">=</span> <span class="num">25</span>`,
    blanks: [{ accepted: ["age"] }]
  },
  {
    num: 3,
    topic: "Variables",
    instruction: "Store the decimal number <strong>3.14</strong> in a variable called <strong>pi</strong>.",
    code: `<span class="var">pi</span> <span class="op">=</span> <input class="blank" data-q="3" data-b="0" placeholder="___">`,
    blanks: [{ accepted: ["3.14"] }]
  },
  {
    num: 4,
    topic: "Arithmetic",
    instruction: "Complete the program to add <strong>a</strong> and <strong>b</strong> and store the result in <strong>total</strong>.",
    code: `<span class="var">a</span> <span class="op">=</span> <span class="num">10</span>\n<span class="var">b</span> <span class="op">=</span> <span class="num">5</span>\n<span class="var">total</span> <span class="op">=</span> <span class="var">a</span> <input class="blank" data-q="4" data-b="0" placeholder="_"> <span class="var">b</span>`,
    blanks: [{ accepted: ["+"] }]
  },
  {
    num: 5,
    topic: "Arithmetic",
    instruction: "Subtract <strong>b</strong> from <strong>a</strong> and store in <strong>result</strong>.",
    code: `<span class="var">a</span> <span class="op">=</span> <span class="num">20</span>\n<span class="var">b</span> <span class="op">=</span> <span class="num">8</span>\n<span class="var">result</span> <span class="op">=</span> <span class="var">a</span> <input class="blank" data-q="5" data-b="0" placeholder="_"> <span class="var">b</span>`,
    blanks: [{ accepted: ["-"] }]
  },
  {
    num: 6,
    topic: "Arithmetic",
    instruction: "Multiply <strong>price</strong> by <strong>quantity</strong> and store in <strong>total_cost</strong>.",
    code: `<span class="var">price</span> <span class="op">=</span> <span class="num">15</span>\n<span class="var">quantity</span> <span class="op">=</span> <span class="num">4</span>\n<span class="var">total_cost</span> <span class="op">=</span> <span class="var">price</span> <input class="blank" data-q="6" data-b="0" placeholder="_"> <span class="var">quantity</span>`,
    blanks: [{ accepted: ["*"] }]
  },
  {
    num: 7,
    topic: "Arithmetic",
    instruction: "Divide <strong>total</strong> by <strong>people</strong> and store the result in <strong>share</strong>.",
    code: `<span class="var">total</span> <span class="op">=</span> <span class="num">100</span>\n<span class="var">people</span> <span class="op">=</span> <span class="num">4</span>\n<span class="var">share</span> <span class="op">=</span> <span class="var">total</span> <input class="blank" data-q="7" data-b="0" placeholder="_"> <span class="var">people</span>`,
    blanks: [{ accepted: ["/"] }]
  },
  {
    num: 8,
    topic: "Print",
    instruction: "Fill in the blank so the output is: <strong>Hello World</strong>",
    code: `<span class="fn">print</span>(<input class="blank" data-q="8" data-b="0" placeholder="___" style="min-width:130px">)`,
    blanks: [{ accepted: ['"Hello World"', "'Hello World'"] }]
  },
  {
    num: 9,
    topic: "F-Strings",
    instruction: "Complete the f-string so it prints the value of the variable <strong>name</strong>.",
    code: `<span class="var">name</span> <span class="op">=</span> <span class="str">"Ali"</span>\n<span class="fn">print</span>(<span class="str">f"My name is <input class="blank" data-q="9" data-b="0" placeholder="___" style="min-width:60px">"</span>)`,
    blanks: [{ accepted: ["{name}"] }]
  },
  {
    num: 10,
    topic: "F-Strings",
    instruction: "Fill both blanks so the output is: <strong>I am 20 years old</strong>",
    code: `<span class="var">age</span> <span class="op">=</span> <span class="num">20</span>\n<span class="fn">print</span>(<input class="blank" data-q="10" data-b="0" placeholder="___" style="min-width:18px"><span class="str">"I am {age} years old"</span>)`,
    blanks: [{ accepted: ["f"] }]
  },
  {
    num: 11,
    topic: "F-Strings",
    instruction: "Complete the program so it prints: <strong>The price is 50</strong>",
    code: `<span class="var">price</span> <span class="op">=</span> <span class="num">50</span>\n<span class="fn">print</span>(<span class="str">f"The price is <input class="blank" data-q="11" data-b="0" placeholder="___" style="min-width:75px">"</span>)`,
    blanks: [{ accepted: ["{price}"] }]
  },
  {
    num: 12,
    topic: "F-Strings",
    instruction: "Store your city name and use an f-string to print: <strong>I live in Hyderabad</strong>",
    code: `<span class="var">city</span> <span class="op">=</span> <input class="blank" data-q="12" data-b="0" placeholder="___" style="min-width:110px">\n<span class="fn">print</span>(<span class="str">f"I live in {city}"</span>)`,
    blanks: [{ accepted: ['"Hyderabad"', "'Hyderabad'"] }]
  },
  {
    num: 13,
    topic: "Input",
    instruction: "Fill in the blank so the program asks the user to enter their name.",
    code: `<span class="var">name</span> <span class="op">=</span> <input class="blank" data-q="13" data-b="0" placeholder="___" style="min-width:55px">(<span class="str">"Enter your name: "</span>)`,
    blanks: [{ accepted: ["input"] }]
  },
  {
    num: 14,
    topic: "Input",
    instruction: "Complete the blank to convert the user's input into an <strong>integer</strong>.",
    code: `<span class="var">age</span> <span class="op">=</span> <input class="blank" data-q="14" data-b="0" placeholder="___" style="min-width:50px">(<span class="fn">input</span>(<span class="str">"Enter age: "</span>))`,
    blanks: [{ accepted: ["int"] }]
  },
  {
    num: 15,
    topic: "Input + Arithmetic",
    instruction: "The user enters a number. Double it and print the result. Fill in the operator.",
    code: `<span class="var">num</span> <span class="op">=</span> <span class="fn">int</span>(<span class="fn">input</span>(<span class="str">"Enter a number: "</span>))\n<span class="var">result</span> <span class="op">=</span> <span class="var">num</span> <input class="blank" data-q="15" data-b="0" placeholder="_"> <span class="num">2</span>\n<span class="fn">print</span>(<span class="str">f"Double is {result}"</span>)`,
    blanks: [{ accepted: ["*"] }]
  },
  {
    num: 16,
    topic: "Variables + Print",
    instruction: "Fill both blanks. The program should print: <strong>Score: 95</strong>",

// ─────────────────────────────────────────────
// RENDER QUESTIONS
// ─────────────────────────────────────────────
function renderQuestions() {
  const form = document.getElementById('quiz-form');
  form.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question';
    card.id = `q${q.num}`;
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="q-header">
        <span class="q-num">Q${String(q.num).padStart(2,'0')}</span>
        <span class="q-topic">${q.topic}</span>
        <span class="q-status" id="status-${q.num}"></span>
        <span class="q-result-badge" id="badge-${q.num}"></span>
      </div>
      <div class="q-body">
        <div class="q-instruction">${q.instruction}</div>
        <div class="code-block">${q.code}</div>
        <div class="answer-reveal" id="reveal-${q.num}"></div>
      </div>`;
    form.appendChild(card);
  });
  attachListeners();
}

// ─────────────────────────────────────────────
// PROGRESS TRACKING
// ─────────────────────────────────────────────
function updateProgress() {
  const all = document.querySelectorAll('.blank');
  const filled = [...all].filter(i => i.value.trim() !== '').length;
  const total = all.length;
  document.getElementById('progressFill').style.width = `${(filled / total) * 100}%`;
  document.getElementById('progressCount').textContent = `${filled} / ${total} filled`;
}

function attachListeners() {
  document.querySelectorAll('.blank').forEach(inp => {
    inp.addEventListener('input', updateProgress);
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const all = [...document.querySelectorAll('.blank')];
        const idx = all.indexOf(inp);
        if (idx < all.length - 1) all[idx + 1].focus();
      }
    });
  });
}

// ─────────────────────────────────────────────
// SUBMIT + GRADING
// ─────────────────────────────────────────────
function normalise(val) {
  return val.trim().replace(/\s+/g, ' ');
}

function submitTest() {
  let correct = 0;
  let total   = 0;

  questions.forEach(q => {
    let qAllCorrect = true;
    const revealLines = [];

    q.blanks.forEach((blank, bIdx) => {
      total++;
      const inp = document.querySelector(`.blank[data-q="${q.num}"][data-b="${bIdx}"]`);
      if (!inp) return;
      const userVal = normalise(inp.value);
      const isCorrect = blank.accepted.some(a => normalise(a) === userVal);

      inp.disabled = true;
      inp.classList.remove('correct', 'wrong');
      inp.classList.add(isCorrect ? 'correct' : 'wrong');

      if (isCorrect) {
        correct++;
      } else {
        qAllCorrect = false;
        revealLines.push(`Blank ${bIdx + 1}: <span class="ans-label">✓</span> ${blank.accepted[0]}`);
      }
    });

    // badge
    const badge = document.getElementById(`badge-${q.num}`);
    badge.className = 'q-result-badge ' + (qAllCorrect ? 'correct' : 'wrong');
    badge.textContent = qAllCorrect ? '✓ Correct' : '✗ Review';

    // reveal wrong answers
    if (revealLines.length > 0) {
      const reveal = document.getElementById(`reveal-${q.num}`);
      reveal.innerHTML = '<strong style="color:var(--muted);font-size:0.78rem;">Correct Answer:</strong><br>' + revealLines.join('<br>');
      reveal.style.display = 'block';
    }
  });

  showResults(correct, total);
  document.querySelector('.btn-submit').disabled = true;
  document.querySelector('.btn-submit').style.opacity = '0.5';
  document.getElementById('results-panel').style.display = 'block';
  setTimeout(() => document.getElementById('results-panel').scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);
}

function showResults(correct, total) {
  const pct = Math.round((correct / total) * 100);
  const wrong = total - correct;

  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statPercent').textContent = pct + '%';

  // circle animation
  const circ = 2 * Math.PI * 48;
  const offset = circ - (pct / 100) * circ;
  const circle = document.getElementById('scoreCircle');
  setTimeout(() => {
    circle.style.strokeDashoffset = offset;
    circle.style.stroke = pct >= 75 ? '#3fb950' : pct >= 50 ? '#e3b341' : '#f78166';
  }, 100);

  let grade, msg;
  if (pct === 100)      { grade = '🏆 Perfect Score!';    msg = 'Absolutely outstanding work!'; }
  else if (pct >= 90)   { grade = '⭐ Excellent';          msg = 'Great mastery of the basics!'; }
  else if (pct >= 75)   { grade = '👍 Good Job';           msg = 'Solid understanding — keep practicing!'; }
  else if (pct >= 50)   { grade = '📚 Keep Studying';      msg = 'Review the topics marked wrong above.'; }
  else                  { grade = '💪 Needs More Practice'; msg = 'Go back to your notes and try again!'; }

  document.getElementById('gradeBadge').textContent = grade;
  document.getElementById('gradeMsg').textContent = msg;
}

function retryTest() {
  document.querySelectorAll('.blank').forEach(inp => {
    inp.value = '';
    inp.disabled = false;
    inp.classList.remove('correct', 'wrong');
  });
  document.querySelectorAll('.q-result-badge').forEach(b => { b.className = 'q-result-badge'; b.textContent = ''; });
  document.querySelectorAll('.answer-reveal').forEach(r => { r.style.display = 'none'; });
  document.getElementById('results-panel').style.display = 'none';
  document.querySelector('.btn-submit').disabled = false;
  document.querySelector('.btn-submit').style.opacity = '1';
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// INIT
renderQuestions();
updateProgress();
</script>
